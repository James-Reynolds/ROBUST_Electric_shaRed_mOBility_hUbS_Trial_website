<h1 id="dundrum-hub">Dundrum hub</h1>

<p>The Dundrum hub is currently under construction. It <a href="https://www.openstreetmap.org/#map=17/53.288007/-6.241211">is located within the Sandyford Road Car Park</a> , a short distance from the Dundrum Town Centre shopping centre, and from the Balally and Dundrum stations on the Luas Green Line</p>
